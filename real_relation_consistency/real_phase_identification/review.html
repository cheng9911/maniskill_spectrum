<!doctype html><html lang="zh"><meta charset="utf-8"><title>真机阶段视频复核</title>
<style>body{font:16px system-ui;margin:24px auto;max-width:1050px;color:#24313b}video{width:640px;max-width:100%;background:#111}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}input[type=number]{width:75px}button,select,input{padding:6px;margin:3px}small{color:#596875}.note{padding:12px;background:#fff1d7}</style>
<h1>真机阶段视频复核</h1><p>先独立观察视频，再标时间区间。自动候选默认隐藏。看不见轴尖接触时选“不可观察”，不要把轴向运动当成接触。剪辑降至 15 fps，原数据为 30 Hz；视频元数据时长一致不保证精确同步。</p>
<p class="note">此页面不操作机器人。尚未填写的项目不是人工真值。填写后导出 JSON，由评价脚本与自动候选比较。</p>
<label>标注者 <input id="rater" placeholder="输入标注者ID"></label><select id="episode"></select><button id="save">保存本条</button><button id="export">导出全部标注</button>
<div><video id="v" controls></video></div><p id="clock"></p><p>以剪辑秒数记录时间范围。明确的一帧可以设置相同上下界；遮挡时应扩大区间或标为不可观察。</p>
<table><thead><tr><th>事件</th><th>状态</th><th>下界(s)</th><th>上界(s)</th><th>取当前时间</th></tr></thead><tbody id="events"></tbody></table>
<p><label>备注 <input id="notes" style="width:70%"></label></p><button id="show">显示自动候选（之后该条标注标记为已看预测）</button><pre id="pred"></pre>
<script>
const manifest=[{"dataset": "insert_jc_fix_3", "episode": 0, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_jc_fix_3/videos/observation.images.head/chunk-000/file-000.mp4", "video_start_s": 5.5, "clip_duration_s": 12.566666666666666, "clip_start_frame": 165, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 195, "lift_clearance": 240, "assembly_region": 278, "axial_advance_candidate": 372, "terminal_settle_candidate": 390, "release": 512}, "clip": "clips/insert_jc_fix_3_000.mp4"}, {"dataset": "insert_jc_fix_3", "episode": 10, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_jc_fix_3/videos/observation.images.head/chunk-000/file-000.mp4", "video_start_s": 216.16666666666669, "clip_duration_s": 12.933333333333334, "clip_start_frame": 140, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 170, "lift_clearance": 218, "assembly_region": 261, "axial_advance_candidate": null, "terminal_settle_candidate": 408, "release": 498}, "clip": "clips/insert_jc_fix_3_010.mp4"}, {"dataset": "insert_jc_fix_3", "episode": 20, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_jc_fix_3/videos/observation.images.head/chunk-000/file-000.mp4", "video_start_s": 407.6, "clip_duration_s": 12.0, "clip_start_frame": 155, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 185, "lift_clearance": 226, "assembly_region": 263, "axial_advance_candidate": 355, "terminal_settle_candidate": 367, "release": 485}, "clip": "clips/insert_jc_fix_3_020.mp4"}, {"dataset": "insert_jc_fix_3", "episode": 49, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_jc_fix_3/videos/observation.images.head/chunk-000/file-001.mp4", "video_start_s": 78.9, "clip_duration_s": 16.533333333333335, "clip_start_frame": 136, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 166, "lift_clearance": 197, "assembly_region": 284, "axial_advance_candidate": 319, "terminal_settle_candidate": 540, "release": 602}, "clip": "clips/insert_jc_fix_3_049.mp4"}, {"dataset": "insert_10degree", "episode": 0, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_10degree/videos/observation.images.head/chunk-000/file-000.mp4", "video_start_s": 10.733333333333333, "clip_duration_s": 24.866666666666667, "clip_start_frame": 322, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 352, "lift_clearance": 402, "assembly_region": 560, "axial_advance_candidate": null, "terminal_settle_candidate": null, "release": 1038}, "clip": "clips/insert_10degree_000.mp4"}, {"dataset": "insert_10degree", "episode": 12, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_10degree/videos/observation.images.head/chunk-000/file-001.mp4", "video_start_s": 123.33333333333331, "clip_duration_s": 21.6, "clip_start_frame": 379, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 409, "lift_clearance": 463, "assembly_region": 549, "axial_advance_candidate": 581, "terminal_settle_candidate": 930, "release": 997}, "clip": "clips/insert_10degree_012.mp4"}, {"dataset": "insert_10degree", "episode": 31, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_10degree/videos/observation.images.head/chunk-000/file-003.mp4", "video_start_s": 302.3333333333333, "clip_duration_s": 22.066666666666666, "clip_start_frame": 231, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 261, "lift_clearance": 355, "assembly_region": 442, "axial_advance_candidate": null, "terminal_settle_candidate": null, "release": 863}, "clip": "clips/insert_10degree_031.mp4"}, {"dataset": "insert_10degree", "episode": 60, "video": "/home/rocos/sia/Sim/robomimic/dataset/data/SunJincheng/insert_10degree/videos/observation.images.head/chunk-000/file-006.mp4", "video_start_s": 47.300000000000004, "clip_duration_s": 24.933333333333334, "clip_start_frame": 288, "fps": 30, "source_duration_mismatch": false, "events": {"grasp": 318, "lift_clearance": 390, "assembly_region": 472, "axial_advance_candidate": 511, "terminal_settle_candidate": 945, "release": 1006}, "clip": "clips/insert_10degree_060.mp4"}], labels={grasp:'夹持闭合',lift_clearance:'抬离拾取位置',assembly_region:'进入装配接近区域',axial_advance_candidate:'可见轴向推进开始',contact:'首次可见接触',terminal_settle_candidate:'末段稳定',release:'释放'};
const v=document.getElementById('v'),pick=document.getElementById('episode');let store=JSON.parse(localStorage.getItem('phase_review_v1')||'{}'),shown=false;
function current(){return manifest[Number(pick.value)||0]}function key(r){return r.dataset+'/'+r.episode}function put(){const r=current();const events={};for(const name of Object.keys(labels)){let row=document.getElementById('row_'+name);events[name]={status:row.querySelector('select').value,lower_clip_s:row.querySelector('.lo').value===''?null:Number(row.querySelector('.lo').value),upper_clip_s:row.querySelector('.hi').value===''?null:Number(row.querySelector('.hi').value)}}store[key(r)]={dataset:r.dataset,episode:r.episode,rater:document.getElementById('rater').value,clip_start_frame:r.clip_start_frame,source_fps:r.fps,review_fps:15,predictions_shown:shown,notes:document.getElementById('notes').value,events};localStorage.setItem('phase_review_v1',JSON.stringify(store))}
function load(){const r=current(),old=store[key(r)];shown=old?.predictions_shown||false;v.src=r.clip;document.getElementById('pred').textContent='';document.getElementById('notes').value=old?.notes||'';document.getElementById('events').innerHTML='';for(const [name,label] of Object.entries(labels)){const e=old?.events?.[name]||{},row=document.createElement('tr');row.id='row_'+name;row.innerHTML=`<td>${label}</td><td><select><option value="unlabeled">未标注</option><option value="observed">可观察</option><option value="unobservable">不可观察</option></select></td><td><input class="lo" type="number" min="0" step="0.067"></td><td><input class="hi" type="number" min="0" step="0.067"></td><td><button class="low">下界</button><button class="high">上界</button></td>`;row.querySelector('select').value=e.status||'unlabeled';row.querySelector('.lo').value=e.lower_clip_s??'';row.querySelector('.hi').value=e.upper_clip_s??'';row.querySelector('.low').onclick=()=>row.querySelector('.lo').value=v.currentTime.toFixed(3);row.querySelector('.high').onclick=()=>row.querySelector('.hi').value=v.currentTime.toFixed(3);document.getElementById('events').append(row)}}
manifest.forEach((r,i)=>pick.add(new Option(r.dataset+' / '+r.episode,i)));pick.onchange=load;document.getElementById('save').onclick=put;document.getElementById('show').onclick=()=>{shown=true;const r=current();document.getElementById('pred').textContent=JSON.stringify(Object.fromEntries(Object.entries(r.events).map(([k,f])=>[k,f===null?null:(f-r.clip_start_frame)/r.fps])),null,2)};
document.getElementById('export').onclick=()=>{put();const blob=new Blob([JSON.stringify({schema:1,annotations:Object.values(store)},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manual_phase_annotations.json';a.click();URL.revokeObjectURL(a.href)};
v.ontimeupdate=()=>document.getElementById('clock').textContent='剪辑 '+v.currentTime.toFixed(3)+' s；原数据约帧 '+Math.round(current().clip_start_frame+v.currentTime*current().fps);load();
</script></html>
